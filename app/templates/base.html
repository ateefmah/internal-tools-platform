<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InternalOps{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">InternalOps</div>
    <nav>
      <a href="/" class="{{ 'on' if active == 'home' }}">Overview</a>
      <a href="/apps/kyc" class="{{ 'on' if active == 'kyc' }}">KYC Review Queue</a>
      <a href="/apps/refunds" class="{{ 'on' if active == 'refunds' }}">Refunds Dashboard</a>
      <a href="/apps/flags" class="{{ 'on' if active == 'flags' }}">Feature Flags</a>
      {% if user.role in ('lead', 'admin') %}
      <a href="/audit" class="{{ 'on' if active == 'audit' }}">Audit Log</a>
      {% endif %}
    </nav>
    <div class="who">
      <div class="who-name">{{ user.name }}</div>
      <div class="who-role">{{ user.role }}</div>
      <form method="post" action="/logout"><button class="link">Sign out</button></form>
    </div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
