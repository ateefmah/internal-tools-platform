<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — InternalOps</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <h1>InternalOps</h1>
    <p class="muted">Sign in to your workspace</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>Email<input name="email" type="email" required autofocus placeholder="analyst@fintech.dev"></label>
    <label>Password<input name="password" type="password" required placeholder="password"></label>
    <button type="submit">Sign in</button>
    <p class="muted small">Demo users: analyst@ / lead@ / admin@fintech.dev — password: <code>password</code></p>
  </form>
</body>
</html>
